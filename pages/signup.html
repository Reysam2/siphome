          </a>
        </div>
      </section>

      <section class="auth__container-blk">
        <h1 class="auth__heading">Create your account</h1>
        <section class="auth__container">
          <form id="form_auth" action="#">
            <div class="full-name">
              <div class="field first-name">
                <label for="firstName">First Name</label>
                <input
                  type="text"
                  id="firstName"
                  name="firstName"
                  placeholder="John"
                  autocomplete="on"
                />
              </div>

              <div class="field last-name">
                <label for="lastName">Last Name</label>
                <input
                  type="text"
                  id="lastName"
                  name="userName"
                  placeholder="Doe"
                  autocomplete="on"
                />
              </div>
            </div>

            <div class="field">
              <label for="userEmail">Email</label>
              <input
                type="email"
                id="userEmail"
                name="userEmail"
                placeholder="Enter your email"
              />
            </div>

            <div class="password-field">
              <div class="field">
                <label for="userPassword">Password</label>
                <input
                  type="password"
                  name="userPassword"
                  id="userPassword"
                  placeholder="Create a password"
                  autocomplete="new-password"
                />
              </div>

              <div class="field">
                <label for="confirmPassword">Confirm Password</label>
                <input
                  type="password"
                  name="Confirm Password"
                  id="confirmPassword"
                  placeholder="Confirm Password"
                  autocomplete="current-password"
                />
              </div>
            </div>

            <div class="field create-btn-blk">
              <button id="create-btn" type="submit" class="create-btn">
                Create Account
              </button>
            </div>
          </form>

          <p class="auth__signin-txt">
            Already have an account?
            <a class="auth__signin-link" href="../pages/signin.html">Sign In</a>
          </p>
        </section>
      </section>

      <section class="auth__video-blk">
        <div class="auth__video">
          <video
            muted
            autoplay
            playsinline
            loop
            src="../assets/video/auth-vid.mp4"
          ></video>
        </div>

        <p class="video__credit">
          <a
            href="https://dribbble.com/shots/21785427-Mushroom-world-for-XR"
            target="_blank"
            >@glebich</a
          >
        </p>
      </section>
    </section>
  </body>
</html>
